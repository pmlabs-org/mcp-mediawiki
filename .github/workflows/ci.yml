name: CI
# Pathfinder fork version — builds and deploys to ghcr.io/pmlabs-org/mcp-mediawiki.
# The upstream preflight job is commented out; upstream CI changes should be
# added to .fork-sync-ignore to prevent them from overwriting this file.

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag previous image for rollback
        run: |
          docker pull ghcr.io/pmlabs-org/mcp-mediawiki:latest || true
          docker tag  ghcr.io/pmlabs-org/mcp-mediawiki:latest \
                      ghcr.io/pmlabs-org/mcp-mediawiki:previous || true
          docker push ghcr.io/pmlabs-org/mcp-mediawiki:previous || true

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/pmlabs-org/mcp-mediawiki:latest
            ghcr.io/pmlabs-org/mcp-mediawiki:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
